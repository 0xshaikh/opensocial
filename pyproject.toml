[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensocial"
version = "0.1.0"
description = "Open-source Buffer alternative - compose, thread, schedule and export social posts. Local-first, zero API keys, zero network posting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anas Shaikh", email = "0xshaikh@users.noreply.github.com" }]
keywords = [
    "social-media",
    "scheduling",
    "content-calendar",
    "buffer-alternative",
    "opensocial",
    "threading",
    "ics",
    "rss",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Marketing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
build = ["build>=1.2", "twine>=4.0"]

[project.scripts]
opensocial = "opensocial.cli:main"

[project.urls]
Homepage = "https://github.com/0xshaikh/opensocial"
Repository = "https://github.com/0xshaikh/opensocial"
Issues = "https://github.com/0xshaikh/opensocial/issues"

[tool.setuptools.packages.find]
include = ["opensocial*"]

[tool.setuptools.package-data]
opensocial = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
